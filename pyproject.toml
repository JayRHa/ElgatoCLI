[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elgato-cli"
version = "0.1.0"
description = "Production-ready CLI for Elgato light control and diagnostics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4.0",
  "elgato==5.1.2",
]

[project.scripts]
elgato = "elgato_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
